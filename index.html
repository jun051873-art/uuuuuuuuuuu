<script type="text/plain" id="cloud-rules">rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function member(salon) { return get(/databases/$(database)/documents/BookingV319/$(salon)/members/$(request.auth.uid)).data; }
  function enabled(salon) {
   return request.auth != null && member(salon).active == true
     && member(salon).role in ['admin','staff']
     && (!('expiresAt' in member(salon)) || member(salon).expiresAt == null || request.time < member(salon).expiresAt);
  }
  function admin(salon) { return enabled(salon) && member(salon).role == 'admin'; }
  function meta(id) { return request.resource.data.id == id && request.resource.data._actor == request.auth.uid; }
  match /BookingV319/{salon}/members/{uid} {
   allow read: if request.auth != null && request.auth.uid == uid;
   allow write: if false; // Provision memberships with Admin SDK / Firebase console only.
  }
  match /BookingV319/{salon}/appointments/{id} {
   allow read: if enabled(salon);
   allow create, update: if enabled(salon) && meta(id)
    && request.resource.data.keys().hasOnly(['id','clientId','guest','legacyUnlinked','name','phone','sex','styId','date','time','duration','people','serviceIds','status','statusTagId','note','vip','overlapReason','durationEstimated','_deleted','_rev','_op','_actor','_updatedAt'])
    && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 100
    && request.resource.data.duration is int && request.resource.data.duration >= 5 && request.resource.data.duration <= 720
    && request.resource.data.people is int && request.resource.data.people >= 1 && request.resource.data.people <= 50
    && request.resource.data.status in ['booked','arrived','serving','completed','cancelled','no_show']
    && request.resource.data.serviceIds is list;
   allow delete: if false;
  }
  match /BookingV319/{salon}/clients/{id} {
   allow read: if enabled(salon);
   allow create, update: if enabled(salon) && meta(id)
    && request.resource.data.keys().hasOnly(['id','name','phone','sex','styId','birthday','note','tags','active','_deleted','_rev','_op','_actor','_updatedAt'])
    && request.resource.data.name is string && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 100;
   allow delete: if false;
  }
  match /BookingV319/{salon}/payments/{id} {
   allow read: if admin(salon);
   allow create, update: if admin(salon) && meta(id)
    && request.resource.data.keys().hasOnly(['id','amount','paid','methodIds','note','_deleted','_rev','_op','_actor','_updatedAt'])
    && request.resource.data.amount is number && request.resource.data.amount >= 0
    && request.resource.data.paid is number && request.resource.data.paid >= 0 && request.resource.data.paid <= request.resource.data.amount;
   allow delete: if false;
  }
  match /BookingV319/{salon}/{kind}/{id} {
   allow read: if enabled(salon) && kind in ['settings','stylists','services','methods','days','blocks','schedules'];
   allow create, update: if admin(salon) && kind in ['settings','stylists','services','methods','days','blocks'] && meta(id);
   // Staff may edit a day note, but cannot set shop closure.
   allow create: if enabled(salon) && kind == 'days' && meta(id) && request.resource.data.off == false;
   allow update: if enabled(salon) && kind == 'days' && meta(id)
    && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['note','color','_rev','_op','_actor','_updatedAt']);
   // Shared day guard serializes normal application scheduling transactions.
   allow create, update: if admin(salon) && kind == 'schedules'
    && request.resource.data.keys().hasOnly(['id','entries','blocks','off'])
    && request.resource.data.id == id;
   allow create: if enabled(salon) && kind == 'schedules'
    && request.resource.data.keys().hasOnly(['id','entries','blocks','off'])
    && request.resource.data.id == id && request.resource.data.off == false
    && request.resource.data.blocks.size() == 0;
   allow update: if enabled(salon) && kind == 'schedules'
    && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['entries']);
   allow delete: if false;
  }
  match /BookingV319/{salon}/operations/{id} {
   allow read: if enabled(salon);
   allow create: if enabled(salon) && request.resource.data.id == id
    && request.resource.data.actor == request.auth.uid
    && request.resource.data.keys().hasOnly(['id','actor','at','records']);
   allow update, delete: if false;
  }
  // All other paths are denied by this standalone ruleset.
  // If this project hosts other apps, merge their scoped rules after review.
  // Do not keep broad public allow rules: matching Firestore allows are additive.
 }
}
</script><script type="text/plain" id="delivery-guide">Aether 預約系統 319.18 — 修正交付說明

319.18：修正較舊雲端快照晚到而覆蓋新畫面的問題；同步失敗與權限錯誤直接顯示原因。

319.9：月曆多選店休；舊排休收納；資料與雲端入口整合；線條圖示與響應式版面；顧客依設計師、標籤、自訂顏色；記住裝置登入。

319.18 新增設定 → 休假與排休（日期範圍、固定星期、設計師時段），舊日期改用選擇器確認候選日期；同步視窗時間即時更新。

319.7 紀錄視窗：恢復大漸層人數與業績，每筆顯示人數與金額；依日期與篩選更新。

319.6 舊雲端資料相容修正
- 無效的舊排休／備忘日期獨立保留在待核對清單，不再阻擋其他資料載入；設定頁可輸入正確日期確認修正。
- 舊預約無法唯一連結原名冊時，保留原姓名電話與消費，標示「未連結名冊」，不額外新增顧客；可從詳細編輯連結。
- 縮減重複相容欄位，降低單一雲端文件大小，保留原資料與未知欄位。
- 已以使用者提供的備份驗證1242筆預約、359位原顧客，轉換往返無正規化資料差異。真實Firebase未讀寫；測試在隔離模擬環境進行。

今日卡片快捷操作
- 今日卡片直接點服務、付款方式、備註、金額、狀態，開啟單項小視窗；點姓名才進詳細資料。
- 服務及付款方式可複選。快捷服務只修改項目，不改變預約時長；調整時間在詳細編輯。
- 金額可分別修改服務金額及已收金額，「已全額收款」按鈕帶入；付款方式標籤不代表已收款。
- 設定 → 預約狀態標籤：新增、改名、配色、移除及恢復。每個標籤固定對應預約／到店／服務中／完成／取消／未到用途，維持排程及營收定義；已使用的舊標籤仍保留。
- 快捷操作會核對最新欄位；衝突不直接覆蓋。狀態重新佔用時段時仍檢查重疊。

過路客、風格與快速紀錄
- 新增預約可取消「加入顧客名冊」：只留下預約、金額與客群，不建立顧客記錄；仍計入預約與營收。既有名冊客人改為過路客不會刪除原顧客。
- 過路客若之後要加入名冊，編輯預約重新勾選，或搜尋選取既有客人；未選舊客則建立新客戶編號。
- 設定 → 外觀與使用習慣：主題色、固定色盤／設計師色、漸層濃淡、圓角、留白、圖表色、新預約是否預設加入名冊。即時預覽，取消不保存。
- 設定 → 標籤名稱與配色：常用標籤、改名、配色；改名更新顧客標籤，移出常用不刪除歷史標籤。
- 紀錄：前一天／後一天／今天，姓名電話、設計師及狀態篩選；明細可切上一筆／下一筆，返回保留日期與篩選。
- 外觀及過路客資訊可備份，沿用 Salons 文件同步。請各裝置使用319.18，舊版不認得過路客。

雲端鑰匙與原版大卡片
- 預設連線畫面為「店號＋雲端鑰匙」。鑰匙透過 Firebase Authentication 驗證，再核對 BookingKeyMembers 中的 UID 與完整店號。

function fixLegacyDate(index){
 requireAdmin();const base=Core.clone(state.data.settings.main),issues=base.legacyDateIssues||[],i=Number(index),issue=issues[i];if(!issue)return;
 const match=String(issue.value).match(/^(\d{4}-\d{2}-\d{2})[‘’'、,，\s]+(\d{1,2})$/),suggest=match?[match[1],match[1].slice(0,8)+match[2].padStart(2,'0')].filter(Core.dateOK):[];

 });
 const add=value=>{const row=document.createElement('div');row.className='holiday-date-row';row.innerHTML=`<input name="recoveryDate" aria-label="正確日期" type="date" required value="${E(value)}"><button type="button" aria-label="移除此日期">移除</button>`;row.querySelector('button').onclick=()=>row.remove();$('#recovery-dates').append(row);};(suggest.length?suggest:['']).forEach(add);$('#recovery-add').onclick=()=>add('');

function holidayDates(from,to,weekdays){
 if(!Core.dateOK(from)||!Core.dateOK(to)||from>to)throw Error('請選擇正確的起訖日期');
 const result=[],d=new Date(from+'T12:00:00Z'),end=new Date(to+'T12:00:00Z');
 if((end-d)/86400000>365)throw Error('一次最多設定一年，請分段安排');
 for(;d<=end;d.setUTCDate(d.getUTCDate()+1)){if(!weekdays.length||weekdays.includes(String(d.getUTCDay())))result.push(d.toISOString().slice(0,10));}
 if(!result.length)throw Error('這段期間沒有符合的星期');return result;
}

 const draw=()=>{const m=$('#holiday-month').value;if(!/^\d{4}-\d{2}$/.test(m))return;const days=R('days').filter(x=>x.off&&x.date.startsWith(m)),blocks=R('blocks').filter(x=>x.date.startsWith(m));const entries=[...days.map(x=>({date:x.date,html:`<button type="button" class="history-row holiday-entry" data-holiday-date="${x.date}"><span><strong>${x.date}</strong><small>整店休假${x.note?' · '+E(x.note):''}</small></span><b>調整 ›</b></button>`})),...blocks.map(x=>({date:x.date+x.start,html:`<button type="button" class="history-row holiday-entry" data-action="edit-block" data-id="${E(x.id)}"><span><strong>${x.date}</strong><small>${E(nameOf('stylists',x.styId))} · ${x.start}–${x.end}${x.note?' · '+E(x.note):''}</small></span><b>調整 ›</b></button>`}))].sort((a,b)=>a.date.localeCompare(b.date));$('#holiday-list').innerHTML=entries.map(x=>x.html).join('')||'<div class="empty">這個月還沒有排休 ♡</div>';$('#holiday-list').querySelectorAll('[data-holiday-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.holidayDate;dayNoteForm();});};

function holidayForm(){
 const base=Core.clone(state.data),settings=base.settings.main;
 openDialog('安排休假',`<div class="form-grid">${field('休假對象',`<select name="holidaySty"><option value="">整間店</option>${options(activeSty(),'')}</select>`)}<div></div>${field('從哪一天',inp('holidayFrom',selectedDate,'date','required'))}${field('到哪一天',inp('holidayTo',selectedDate,'date','required'))}</div><details class="form-details"><summary>每週固定日／指定時段</summary><p class="hint">只套用上方日期範圍；不選星期就是每天。</p><div class="check-chips">${['日','一','二','三','四','五','六'].map((n,i)=>`<label><input type="checkbox" name="holidayWeek" value="${i}">週${n}</label>`).join('')}</div><div id="holiday-times" hidden><label class="check"><input type="checkbox" name="holidayFull" checked>設計師整個營業時段休假</label><div class="form-grid">${field('開始',inp('holidayStart',settings.start,'time','required'))}${field('結束',inp('holidayEnd',settings.end,'time','required'))}</div></div></details>${field('休假備註（選填）',inp('holidayNote','','text','maxlength="200" placeholder="例如：旅行、進修"'))}<div class="notice" id="holiday-preview" aria-live="polite"></div>`,async fd=>{
 const dates=holidayDates(fd.get('holidayFrom'),fd.get('holidayTo'),fd.getAll('holidayWeek')),sty=fd.get('holidaySty'),full=fd.has('holidayFull'),start=full?settings.start:fd.get('holidayStart'),end=full?settings.end:fd.get('holidayEnd'),note=fd.get('holidayNote').trim();
 await commit(d=>{
 if(sty&&(!d.stylists[sty]?.active||!(Core.mins(start)<Core.mins(end))))throw Error('請確認設計師與休假時間');
 if(sty&&full&&(d.settings.main.start!==settings.start||d.settings.main.end!==settings.end))throw Error('營業時間已更新，請重新開啟排休設定');
 const conflicts=Core.rows(d,'appointments').filter(a=>dates.includes(a.date)&&Core.active(a)&&(!sty||(a.styId===sty&&Core.mins(a.time)<Core.mins(end)&&Core.mins(a.time)+a.duration>Core.mins(start))));
 if(conflicts.length)throw Error('尚未儲存：與 '+conflicts.slice(0,4).map(a=>a.date+' '+a.time+' '+a.name).join('、')+' 的預約重疊，請先改期或取消');
 for(const date of dates){if(!sty){assertCurrent(d,'days',date,base.days[date]||null);const old=d.days[date];d.days[date]={...old,id:date,date,off:true,note:[...new Set([old?.note,note].filter(Boolean))].join('\n'),color:old?.color||settings.offColor||'#D4AF37'};}else{if(Core.rows(d,'blocks').some(x=>x.date===date&&x.styId===sty&&x.start===start&&x.end===end))continue;const id=Core.uid();d.blocks[id]={id,date,styId:sty,start,end,note};}}
 },'休假已安排，共 '+dates.length+' 天');
 },'儲存休假');
 const form=$('#dialog-body');const preview=()=>{const q=n=>form.querySelector('[name="'+n+'"]'),sty=q('holidaySty').value;$('#holiday-times').hidden=!sty;for(const n of ['holidayStart','holidayEnd'])q(n).disabled=!sty||q('holidayFull').checked;try{const dates=holidayDates(q('holidayFrom').value,q('holidayTo').value,[...form.querySelectorAll('[name="holidayWeek"]:checked')].map(x=>x.value));const start=q('holidayFull').checked?settings.start:q('holidayStart').value,end=q('holidayFull').checked?settings.end:q('holidayEnd').value;const conflicts=R('appointments').filter(a=>dates.includes(a.date)&&Core.active(a)&&(!sty||(a.styId===sty&&Core.mins(a.time)<Core.mins(end)&&Core.mins(a.time)+a.duration>Core.mins(start))));$('#holiday-preview').textContent='將安排 '+dates.length+' 天 · '+(sty?nameOf('stylists',sty):'整間店')+(conflicts.length?' · 有 '+conflicts.length+' 筆預約重疊，儲存前需處理':' · 沒有預約衝突');}catch(e){$('#holiday-preview').textContent=e.message;}};form.querySelectorAll('input,select').forEach(x=>x.addEventListener('change',preview));preview();
}

 const dates=[...chosen].sort();if(!dates.length)throw Error('請先點選店休日期');
 await commit(d=>{const hits=Core.rows(d,'appointments').filter(a=>dates.includes(a.date)&&Core.active(a));if(hits.length)throw Error('尚未儲存：'+hits.slice(0,4).map(a=>a.date+' '+a.name).join('、')+' 仍有預約，請先調整');for(const date of dates){assertCurrent(d,'days',date,base.days[date]||null);const old=d.days[date];d.days[date]={...old,id:date,date,off:true,note:[...new Set([old?.note,fd.get('miniNote').trim()].filter(Boolean))].join('\n'),color:old?.color||d.settings.main.offColor||'#D4AF37'};}},'店休已儲存，共 '+dates.length+' 天');
 },'儲存店休');

 $('#mini-month').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;draw();}};const shift=n=>{const [y,m]=month.split('-').map(Number);month=new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7);$('#mini-month').value=month;draw();};$('#mini-prev').onclick=()=>shift(-1);$('#mini-next').onclick=()=>shift(1);draw();

actions['remember-device']=async()=>{

function memoInk(color){const h=Core.color(color).slice(1);const v=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2]>.179?'#242028':'#ffffff';}
function calendarMemo(date){
 checkWritable();const base=Core.clone(state.data.days[date]||null),old=base||{id:date,date,off:false,note:'',color:'#f5d897'};
 const save=async(note,color)=>commit(d=>{const now=d.days[date];if((now?.note||'')!==(base?.note||'')||(now?.color||'')!==(base?.color||''))throw Error('這天的備忘剛被更新，請重新開啟核對');d.days[date]={...old,...now,id:date,date,note,color};},note?'日期備忘已儲存':'日期備忘已刪除');
 openDialog('日期備忘 · '+date,`<div class="memo-editor">${field('當日事項',`<textarea name="memo" maxlength="2000" placeholder="輸入這天想記住的事…">${E(old.note)}</textarea>`)}<label class="memo-color-row">選擇底色<input type="color" name="memoColor" value="${Core.color(old.color)}"></label><div class="memo-preview" id="memo-preview"></div>${old.note?'<button type="button" id="memo-delete" class="text-btn">刪除備忘</button>':''}</div>`,async fd=>save(fd.get('memo').trim(),fd.get('memoColor')),'儲存備忘');
 const text=$('[name=memo]'),color=$('[name=memoColor]'),draw=()=>{const p=$('#memo-preview');p.textContent=text.value||'備忘會顯示在這一天的日期格內';p.style.background=color.value;p.style.color=memoInk(color.value);};text.oninput=draw;color.oninput=draw;draw();text.focus();
 const del=$('#memo-delete');if(del)del.onclick=async()=>{del.disabled=true;try{await save('',old.color);closeDialog();}catch(e){toast(e.message,true);del.disabled=false;}};
}
function slotMenu(styId,time){const date=selectedDate;openDialog('管理 '+time+' 時段 · '+nameOf('stylists',styId),`<div class="slot-options"><button type="button" class="primary" id="slot-book">新增顧客預約</button>${isAdmin()?'<button type="button" id="slot-cross">劃掉此時段</button>':''}</div>`,null);$('#slot-book').onclick=()=>bookingForm('',{date,styId,time});const cross=$('#slot-cross');if(cross)cross.onclick=async()=>{cross.disabled=true;try{await crossTime(date,styId,time);closeDialog();}catch(e){toast(e.message,true);cross.disabled=false;}};}
async function crossTime(date,styId,start){requireAdmin();const end=Core.clock(Math.min(Core.mins(start)+60,Core.mins(state.data.settings.main.end))),id=Core.uid();await commit(d=>{if(!(Core.mins(start)<Core.mins(end)))throw Error('這個時間不在營業時段內');if(Core.rows(d,'appointments').some(a=>Core.active(a)&&a.date===date&&a.styId===styId&&Core.mins(a.time)<Core.mins(end)&&Core.mins(a.time)+a.duration>Core.mins(start)))throw Error('這段已有預約，不能劃掉');if(Core.rows(d,'blocks').some(b=>b.date===date&&b.styId===styId&&Core.mins(b.start)<Core.mins(end)&&Core.mins(b.end)>Core.mins(start)))throw Error('這段已經劃掉');d.blocks[id]={id,date,styId,start,end,note:''};},'時段已劃掉');}
function restoreSlot(id){const base=Core.clone(state.data.blocks[id]);if(!base)return;openDialog('恢復 '+base.start+'–'+base.end+' 接約',`<p>${E(nameOf('stylists',base.styId))} · ${E(base.date)}</p>`,async()=>{await commit(d=>{assertCurrent(d,'blocks',id,base);d.blocks[id]={...base,_deleted:true};},'已恢復接約');},'恢復此時段');}

(()=>{let hold=null,suppress=null;const stop=()=>{if(hold){clearTimeout(hold.timer);hold.button.classList.remove('holding');hold=null;}};
 const activate=b=>{if(b.matches('.cal-day'))calendarMemo(b.dataset.id);else if(isAdmin())return crossTime(selectedDate,b.dataset.id,b.dataset.time);};

const Revisit={
 days:(a,b)=>Math.floor((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000),
 info(d,c,today){const rows=Object.values(d.appointments).filter(a=>!a._deleted&&a.clientId===c.id&&!a.guest&&!a.legacyUnlinked),done=rows.filter(a=>a.status==='completed'&&a.date<=today).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),last=done[0]?.date||'',cfg=d.settings.main.revisit||{},personal=c.followup||{},serviceDays=done.filter(a=>a.date===last).flatMap(a=>a.serviceIds||[]).map(id=>Number(cfg.serviceDays?.[id])).filter(n=>n>0),cycle=Number(personal.days)|| (serviceDays.length?Math.min(...serviceDays):Number(cfg.days)||45),elapsed=last?this.days(last,today):null,next=rows.filter(a=>['booked','arrived','serving'].includes(a.status)&&a.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0]?.date||'',contact=personal.contactedAt||'',cooldown=Number(cfg.cooldown)||14,recent=contact&&this.days(contact,today)<cooldown;
 return {last,elapsed,cycle,next,visits:new Set(done.map(a=>a.date)).size,amount:done.reduce((n,a)=>n+(Number(d.payments[a.id]?.amount)||0),0),contact,due:!!last&&elapsed>=cycle&&!next&&!recent&&c.active!==false&&personal.allowed!==false&&!personal.guest,done};},
 phone(value){const p=String(value||'').replace(/[\s()-]/g,'');return /^\+?\d{8,15}$/.test(p)?p:'';},
 message(d,c){const cfg=d.settings.main.revisit||{},tpl=cfg.message||'{姓名}你好，我是{設計師} ☺️ 最近頭髮還好整理嗎？如果想修整一下，歡迎找我約時間，照你的步調就好。';return tpl.replace(/\{(姓名|設計師|店名)\}/g,(_,k)=>({姓名:c.name,設計師:d.stylists[c.styId]?.name||d.settings.main.name,店名:d.settings.main.name})[k]);}
};

function revisitSummary(c){const r=Revisit.info(state.data,c,Core.today());return `<div class="revisit-summary"><span>${r.last?`上次 ${r.last} · <b>${r.elapsed} 天沒來</b>`:'尚無已完成來店紀錄'}</span><small>累積 ${r.visits} 次來店${isAdmin()?' · $'+F(r.amount):''}${r.next?' · 已約 '+r.next:r.due?' · 待關心':''}</small></div>`;}
function revisitSettings(){requireAdmin();const base=Core.clone(state.data.settings.main),v=base.revisit||{};openDialog('回訪習慣',`${field('預設多久沒來提醒（天）',inp('rvDays',v.days||45,'number','min="1" max="730" required'))}${field('聯絡後暫停提醒（天）',inp('rvCooldown',v.cooldown||14,'number','min="1" max="365" required'))}<details class="form-details"><summary>依服務項目設定週期</summary><p class="hint">留白跟隨預設；上次同日多項服務取最短週期。個別顧客設定優先。</p>${R('services').map(x=>field(E(x.name),inp('rvSvc-'+x.id,v.serviceDays?.[x.id]||'','number','min="1" max="730"'))).join('')}</details>${field('關心訊息範例',`<textarea name="rvMessage" maxlength="1000">${E(v.message||'{姓名}你好，我是{設計師} ☺️ 最近頭髮還好整理嗎？如果想修整一下，歡迎找我約時間，照你的步調就好。')}</textarea>`)}<p class="hint">可用 {姓名}、{設計師}、{店名}。只產生草稿，不自動發送。</p>`,async fd=>{const serviceDays={};for(const x of R('services'))if(fd.get('rvSvc-'+x.id)){const n=Number(fd.get('rvSvc-'+x.id));if(!Number.isInteger(n)||n<1||n>730)throw Error('服務週期請填1至730天');serviceDays[x.id]=n;}const days=Number(fd.get('rvDays')),cooldown=Number(fd.get('rvCooldown'));if(!Number.isInteger(days)||days<1||days>730||!Number.isInteger(cooldown)||cooldown<1||cooldown>365)throw Error('請填寫有效天數');await commit(d=>{if(!Core.eq(d.settings.main.revisit||{},base.revisit||{}))throw Error('設定已更新，請重新開啟');d.settings.main.revisit={days,cooldown,serviceDays,message:fd.get('rvMessage').trim()};},'回訪設定已保存');});}
function revisitClient(id){const c=Core.clone(state.data.clients[id]);if(!c)return;const r=Revisit.info(state.data,c,Core.today()),v=c.followup||{},allowed=v.allowed!==false&&!v.guest,phone=Revisit.phone(c.phone);
 openDialog(c.name+' · 關心一下',`${revisitSummary(c)}<p class="hint">${r.next?'已有下次預約 '+r.next+'，不列入待關心。':r.last?'回訪週期 '+r.cycle+' 天。':'僅採已連結顧客的完成紀錄，不用姓名猜配。'}${r.contact?' 上次手動標記聯絡：'+E(r.contact):''}</p><details class="form-details"><summary>這位顧客的回訪設定</summary><label class="check"><input type="checkbox" name="rvAllowed" ${v.allowed!==false?'checked':''}>列入回訪關心（確認顧客接受聯絡）</label><label class="check"><input type="checkbox" name="rvGuest" ${v.guest?'checked':''}>過路客，不提醒</label>${field('專屬回訪天數（留白跟隨全店）',inp('rvPersonal',v.days||'','number','min="1" max="730"'))}<button type="button" id="rv-save">儲存這位顧客設定</button></details>${allowed?`<p class="hint">${phone?'簡訊收件電話：'+E(phone):'可複製訊息到 LINE'}</p>${field('訊息草稿（可修改）',`<textarea id="rv-draft" maxlength="1000">${E(Revisit.message(state.data,c))}</textarea>`)}<div class="tools"><button type="button" id="rv-copy">複製訊息</button>${phone?'<a class="rv-sms" id="rv-sms">開啟簡訊草稿</a>':'<small>未留有效電話，可複製後貼到 LINE</small>'}<button type="button" id="rv-contact">我已聯絡</button></div><p class="hint">開啟簡訊後由你確認收件人並送出，可能產生電信費用。部分裝置無法帶入文字，請先複製再貼上；電腦需有簡訊應用程式。複製／開啟不會當成已發送。</p>`:'<p class="hint">已停止回訪訊息；調整設定並儲存後才能建立草稿。</p>'}`,null);
 const save=async patch=>commit(d=>{assertCurrent(d,'clients',id,c);d.clients[id].followup={...v,...patch};},'回訪資料已保存');
 $('#rv-save').onclick=async()=>{try{const val=$('[name=rvPersonal]').value,n=val?Number(val):null;if(n!==null&&(!Number.isInteger(n)||n<1||n>730))throw Error('請填1至730天');await save({allowed:$('[name=rvAllowed]').checked,guest:$('[name=rvGuest]').checked,days:n});revisitClient(id);}catch(e){toast(e.message,true);}};
 if(!allowed)return;const draft=$('#rv-draft'),sms=$('#rv-sms');function link(){if(sms){const apple=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);sms.href='sms:'+phone+(apple?'&':'?')+'body='+encodeURIComponent(draft.value);}}draft.oninput=link;link();
 $('#rv-copy').onclick=async()=>{try{await navigator.clipboard.writeText(draft.value);toast('已複製，可貼到簡訊或 LINE');}catch{draft.focus();draft.select();if(document.execCommand('copy'))toast('已複製');else toast('請長按選取文字後複製');}};
 $('#rv-contact').onclick=async()=>{try{await save({contactedAt:Core.today()});closeDialog();}catch(e){toast(e.message,true);}};
}
actions['revisit-filter']=()=>{revisitOnly=!revisitOnly;renderClients();};actions['revisit-settings']=revisitSettings;actions['revisit-client']=revisitClient;
window.Revisit=Revisit;
function dayHeading(date,today){const gap=Math.round((Date.parse(date+'T12:00:00Z')-Date.parse(today+'T12:00:00Z'))/86400000);return gap===0?'今日預約':gap===-1?'昨日預約':gap===1?'明日預約':Number(date.slice(5,7))+'月'+Number(date.slice(8,10))+'日預約';}
function renderGlassHeader(){
 const center=$('#header-center'),today=Core.today();
 if(locked){center.innerHTML='';return;}
 const metric=(label,value)=>`<span class="glass-metric"><small>${label}</small><strong>${value}</strong></span>`;
 if(page==='day'){
  $('#brand').textContent=dayHeading(selectedDate,today);
  const s=Core.stats(state.data,selectedDate,selectedDate,styFilter),week=['日','一','二','三','四','五','六'][new Date(selectedDate+'T12:00:00').getDay()];
  center.innerHTML=`<div class="glass-date-controls"><button data-action="prev-day" aria-label="前一天" title="前一天">‹</button><label class="glass-date"><small>星期${week} · 點選日期</small><input id="day-picker" aria-label="切換預約日期" type="date" value="${selectedDate}"></label><button data-action="next-day" aria-label="後一天" title="後一天">›</button><button class="glass-today" data-action="today">回到今天</button></div><div class="glass-summary">${metric('有效預約',s.all.filter(Core.active).length+' 筆')}${metric('已完成',s.people+' 人')}${isAdmin()?metric('完成金額','$'+F(s.revenue)):''}</div>`;
  $('#day-picker').onchange=e=>{if(Core.dateOK(e.target.value)){selectedDate=e.target.value;render();}};
 }else if(page==='stats'){
  const s=Core.stats(state.data,statsFrom,statsTo,statsSty);center.innerHTML=`<div class="glass-summary stats-header-summary">${metric('統計期間',E(statsFrom.slice(5))+' — '+E(statsTo.slice(5)))}${isAdmin()?metric('完成金額','$'+F(s.revenue)):''}</div>`;
 }else{center.innerHTML='';}

}
actions['header-revisit']=()=>{page='clients';revisitOnly=true;render();$('#content').scrollTop=0;};
const headerResize=()=>document.documentElement.style.setProperty('--header-height',Math.ceil(document.querySelector('.header').getBoundingClientRect().height)+'px');
if(typeof ResizeObserver!=='undefined')new ResizeObserver(headerResize).observe(document.querySelector('.header'));
window.addEventListener('resize',headerResize);headerResize();
</script></body></html>

<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether 店家管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#233b35;font:17px system-ui}header,main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:26px}h2{font-size:21px}section,article{background:white;border:1px solid #d8e4dd;border-radius:20px;padding:22px;margin-bottom:18px}label{display:block;margin:14px 0;font-weight:650}input,textarea,select,button{font:inherit;min-width:0;border:1px solid #b9ccc2;border-radius:12px;padding:12px}input,textarea,select{display:block;width:100%;margin-top:6px;background:#fff}button{background:#285d4a;color:white;cursor:pointer;min-height:46px}button:disabled{opacity:.5}button.secondary{background:#f0f5f2;color:#285d4a}p{line-height:1.65;overflow-wrap:anywhere}.row{display:flex;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}[hidden]{display:none!important}#status{white-space:pre-wrap;padding:0 24px;max-width:1000px;margin:auto;line-height:1.6;color:#8a3b27}small{color:#586d64}dialog{width:min(700px,94vw);max-height:90dvh;overflow:auto;border:0;border-radius:22px;padding:24px}dialog::backdrop{background:#102b2466}summary{cursor:pointer;font-weight:700;padding:12px 0}@media(max-width:540px){header,main{padding:18px}.grid{grid-template-columns:1fr}section,article{padding:18px}h1{font-size:23px}}
</style><header><div><small>AETHER · 販售管理</small><h1>店家與購買者</h1></div><button id="logout" hidden class="secondary">登出</button></header><p id="status" role="status" aria-live="polite">正在載入登入服務…</p><main>
<section id="login"><h2>管理者登入</h2><p>使用你剛建立的管理者電子郵件與密碼。這個入口連接獨立的販售雲端。</p><form id="loginForm"><label>電子郵件<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><div class="row"><button>登入</button><button type="button" id="reset" class="secondary">忘記密碼</button></div></form></section>
<section id="verify" hidden><h2>請先驗證電子郵件</h2><p id="who"></p><div class="row"><button id="send">寄送驗證信</button><button id="refresh" class="secondary">我已完成驗證</button></div></section>
<section id="denied" hidden><h2>此帳號沒有管理權限</h2><p>請登出，改用已指定的管理者帳號。</p></section>
<div id="workspace" hidden><section><h2>待開通申請</h2><p>確認收到款項或同意試用後，再選擇方案與期限開通。此處不會自動扣款。</p><div id="requests"></div></section><section><div class="row"><button id="new" hidden>手動建立既有帳號店家</button><button id="reload" class="secondary">重新讀取</button></div><label>搜尋店名、購買者或信箱<input id="search" type="search" placeholder="輸入關鍵字"></label><small>這裡管理店家授權；採人工確認收款；買家自行申請後，請從上方開通。</small></section><div id="list"></div></div>
<dialog id="editor"><h2 id="editTitle">新增購買店家</h2><form id="orgForm"><div class="grid"><label>店家名稱<input name="name" required maxlength="100"></label><label>購買者姓名<input name="buyerName" maxlength="100"></label><label>購買者電子郵件<input name="email" type="email" required maxlength="254"></label><label>電話<input name="phone" type="tel" maxlength="40"></label><label>方案名稱<input name="plan" required maxlength="80"></label><label>授權到期時間（本地時間）<input name="expiresAt" type="datetime-local" required></label><label>授權狀態<select name="active"><option value="true">啟用</option><option value="false">停用</option></select></label><label id="ownerLabel">店主帳號 UID<input name="ownerUid" required maxlength="128" pattern="[^/ ]+"><small>先在新雲端 Authentication 建立購買者帳號，再貼上 UID；此表單不會建立登入帳號。</small></label><label id="branchLabel">第一間分店名稱<input name="branchName" maxlength="100"></label></div><label>備註<textarea name="note" maxlength="3000" rows="3"></textarea></label><p id="formStatus" role="status"></p><div class="row"><button id="save">儲存</button><button type="button" id="close" class="secondary">取消</button></div></form></dialog></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// 獨立販售專案的公開 Web SDK 設定；不連接現場 SalonSystem。
window.AETHER_COMMERCIAL={
  "firebase": {
    "apiKey": "AIzaSyC67qktIVgj_e3bQZ1z_vw9wSOeDvU9ZYc",
    "authDomain": "aether-booking-production.firebaseapp.com",
    "projectId": "aether-booking-production",
    "storageBucket": "aether-booking-production.firebasestorage.app",
    "messagingSenderId": "228015299472",
    "appId": "1:228015299472:web:fe07e147b2dc98036ef115"
  }
};
(()=>{'use strict';const $=id=>document.getElementById(id),operatorUid='OghY8S8U5sWJyJ81KZniCxCDLRP2';let auth,db,organizations=[],branches=[],editing=null,approval=null,requests=[],requestUnsub=null,epoch=0;const say=s=>$('status').textContent=s;const error=e=>({'permission-denied':'雲端拒絕存取。請確認發布的完整規則包含營運者權限，且信箱已驗證。','auth/invalid-credential':'電子郵件或密碼不正確。','auth/network-request-failed':'網路連線失敗，請稍後重試。','auth/too-many-requests':'操作過於頻繁，請稍後再試。'}[e.code]||'操作未完成：'+(e.code||e.message));async function run(button,fn){button.disabled=true;try{await fn()}catch(e){say(error(e))}finally{button.disabled=false}}
function allowed(){return auth.currentUser?.uid===operatorUid&&auth.currentUser.emailVerified}function elem(tag,text){const el=document.createElement(tag);el.textContent=text;return el}function render(){renderRequests();const q=$('search').value.trim().toLowerCase();$('list').replaceChildren();const found=organizations.filter(o=>[o.name,o.buyerName,o.email].some(v=>String(v||'').toLowerCase().includes(q)));if(!found.length)$('list').append(elem('p',organizations.length?'沒有符合的店家。':'目前尚未建立購買店家。'));for(const o of found){const card=elem('article','');card.append(elem('h2',o.name),elem('p',`${o.buyerName||'未填姓名'} · ${o.email||'未填信箱'}`),elem('p',`${o.plan} · ${!o.active?'已停用':o.expiresAt.toMillis()<=Date.now()?'已到期':'啟用中'} · 到期 ${o.expiresAt.toDate().toLocaleString('zh-TW')}`));const edit=elem('button','編輯授權與資料');edit.onclick=()=>openEditor(o);card.append(edit);const details=elem('details','');details.append(elem('summary','分店與人員'));for(const b of branches.filter(b=>b.orgId===o.id)){const wrap=elem('div','');wrap.append(elem('p',b.name+' · '+(b.active?'啟用':'停用')+' · 分店代碼：'+b.id));const btn=elem('button','查看人員');btn.className='secondary';btn.onclick=()=>run(btn,async()=>{const currentEpoch=epoch;const snap=await db.collection('BookingV319').doc(b.id).collection('members').get();if(currentEpoch!==epoch)return;const ul=elem('ul','');snap.forEach(d=>{const m=d.data();ul.append(elem('li',`${m.email||d.id} · ${m.role==='admin'?'管理員':'員工'} · ${m.active?'啟用':'停用'}`))});wrap.replaceChildren(wrap.firstChild,ul)});wrap.append(btn);details.append(wrap)}card.append(details);$('list').append(card)}}
function renderRequests(){const box=$('requests');box.replaceChildren();const pending=requests.filter(r=>r.state==='pending');if(!pending.length)box.append(elem('p','目前沒有待開通申請。'));for(const r of pending){const card=elem('article','');card.append(elem('h2',r.name),elem('p',r.buyerName+' · '+r.email),elem('p',r.phone||'未填電話'));const b=elem('button','確認收款／開通試用');b.onclick=()=>{openEditor();approval=r;const f=$('orgForm');for(const k of ['name','buyerName','email','phone'])f.elements[k].value=r[k]||'';f.elements.ownerUid.value=r.id;f.elements.ownerUid.readOnly=true;f.elements.email.readOnly=true;$('ownerLabel').hidden=true;f.elements.branchName.value=r.name;$('editTitle').textContent='開通 '+r.name;};card.append(b);box.append(card)}}
async function load(){if(!allowed())return;const currentEpoch=epoch;say('正在讀取店家…');try{const [a,b,r]=await Promise.all([db.collection('Organizations').get(),db.collection('BookingV319').get(),db.collection('PurchaseRequests').get()]);requests=r.docs.map(d=>({...d.data(),id:d.id}));if(currentEpoch!==epoch)return;organizations=a.docs.map(d=>({...d.data(),id:d.id}));branches=b.docs.map(d=>({...d.data(),id:d.id}));render();say('已連接販售雲端 · '+organizations.length+' 家店')}catch(e){if(currentEpoch===epoch)say(error(e))}}
async function state(user){epoch++;requestUnsub?.();requestUnsub=null;requests=[];$('requests').replaceChildren();organizations=[];branches=[];$('list').replaceChildren();$('editor').close();$('login').hidden=!!user;$('logout').hidden=!user;$('verify').hidden=!user||user.emailVerified;$('denied').hidden=!user||!user.emailVerified||user.uid===operatorUid;$('workspace').hidden=!user||!user.emailVerified||user.uid!==operatorUid;if(!user){say('請登入管理者帳號。');return}if(!user.emailVerified){$('who').textContent=user.email;say('驗證信箱後才能讀取店家資料。');return}if(user.uid!==operatorUid){say('目前登入的帳號不是指定管理者。');return}await load();requestUnsub=db.collection('PurchaseRequests').onSnapshot(s=>{requests=s.docs.map(d=>({...d.data(),id:d.id}));renderRequests()},e=>say(error(e)))}
function openEditor(o){approval=null;editing=o||null;const f=$('orgForm');f.reset();$('formStatus').textContent='';$('editTitle').textContent=o?'編輯店家':'新增購買店家';for(const key of ['name','buyerName','email','phone','plan','ownerUid','note'])f.elements[key].value=o?.[key]||'';f.elements.active.value=String(o?.active??true);f.elements.ownerUid.readOnly=!!o;f.elements.email.readOnly=false;$('ownerLabel').hidden=!!o;$('branchLabel').hidden=!!o;f.elements.branchName.required=!o;if(o){const date=o.expiresAt.toDate();date.setMinutes(date.getMinutes()-date.getTimezoneOffset());f.elements.expiresAt.value=date.toISOString().slice(0,16)}$('editor').showModal()}
$('orgForm').onsubmit=async e=>{e.preventDefault();if(!allowed())return;const f=e.currentTarget,button=$('save');button.disabled=true;$('close').disabled=true;try{const values=Object.fromEntries(new FormData(f));const data={};for(const key of ['name','buyerName','email','phone','plan','ownerUid','note'])data[key]=values[key].trim();const expiry=new Date(values.expiresAt);if(!Number.isFinite(+expiry))throw Error('請填寫有效的到期時間');data.expiresAt=firebase.firestore.Timestamp.fromDate(expiry);data.active=values.active==='true';const orgRef=editing?db.collection('Organizations').doc(editing.id):db.collection('Organizations').doc(),branchRef=editing?null:db.collection('BookingV319').doc(crypto.randomUUID().replaceAll('-','').toUpperCase());await db.runTransaction(async tx=>{if(approval){const r=await tx.get(db.collection('PurchaseRequests').doc(approval.id));if(!r.exists||r.data().state!=='pending')throw Error('此申請已處理，請重新讀取');if(data.ownerUid!==approval.id||data.email!==r.data().email)throw Error('申請人身分不可變更');}if(editing){const latest=await tx.get(orgRef);const old=latest.data();if(!old||['name','buyerName','email','phone','plan','ownerUid','note','active'].some(k=>old[k]!==editing[k])||old.expiresAt.toMillis()!==editing.expiresAt.toMillis())throw Error('這家店已被更新，請取消並重新讀取後再編輯');}tx.set(orgRef,data);if(approval)tx.update(db.collection('PurchaseRequests').doc(approval.id),{state:'approved',orgId:orgRef.id,branchId:branchRef.id,processedAt:firebase.firestore.FieldValue.serverTimestamp()});if(branchRef){tx.set(branchRef,{orgId:orgRef.id,name:values.branchName.trim(),active:true});tx.set(branchRef.collection('members').doc(data.ownerUid),{role:'admin',active:true,email:data.email})}tx.set(db.collection('OperatorAudit').doc(),{actor:auth.currentUser.uid,event:editing?'update-organization':'open-store',orgId:orgRef.id,branchId:branchRef?.id||'',reference:data.name,at:firebase.firestore.FieldValue.serverTimestamp()})});$('editor').close();await load()}catch(e){$('formStatus').textContent=error(e)}finally{button.disabled=false;$('close').disabled=false}};
$('editor').addEventListener('cancel',e=>{if($('save').disabled)e.preventDefault()});$('close').onclick=()=>$('editor').close();$('new').onclick=()=>openEditor();$('search').oninput=render;$('reload').onclick=e=>run(e.currentTarget,load);$('loginForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value);$('password').value=''})};$('logout').onclick=e=>run(e.currentTarget,()=>auth.signOut());$('send').onclick=e=>run(e.currentTarget,async()=>{await auth.currentUser.sendEmailVerification();say('驗證信已寄出，請查看收件匣或垃圾郵件。')});$('refresh').onclick=e=>run(e.currentTarget,async()=>{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);await state(auth.currentUser)});$('reset').onclick=e=>run(e.currentTarget,async()=>{if(!$('email').value.trim())throw Error('請先填電子郵件');await auth.sendPasswordResetEmail($('email').value.trim());say('若此信箱可重設密碼，請查看收到的郵件。')});try{const app=firebase.initializeApp(window.AETHER_COMMERCIAL.firebase,'aether-operator');auth=app.auth();db=app.firestore();auth.languageCode='zh-TW';auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(()=>auth.onAuthStateChanged(state)).catch(e=>say(error(e)))}catch(e){say('登入服務未載入，請確認網路後重新整理。')}
})();
</script></html>

<script>'use strict';
/* Aether Booking 319.1 — data model, migration, validation, field-level merge. */
const Core = (() => {
 const kinds=['settings','stylists','services','methods','clients','appointments','payments','days','blocks'];
 const states={booked:'已預約',arrived:'已到店',serving:'服務中',completed:'已完成',cancelled:'已取消',no_show:'未到'};
 const clone=x=>JSON.parse(JSON.stringify(x));
 const eq=(a,b)=>{
  if(a===b)return true;if(a==null||b==null)return a==null&&b==null;
  if(typeof a!=='object'||typeof b!=='object')return false;
  if(Array.isArray(a)!==Array.isArray(b))return false;
  const ak=Object.keys(a),bk=Object.keys(b);return ak.length===bk.length&&ak.every(k=>Object.prototype.hasOwnProperty.call(b,k)&&eq(a[k],b[k]));
 };
 const uid=()=>globalThis.crypto?.randomUUID?.() || 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);
 const text=(x,max=2000)=>String(x??'').slice(0,max);
 const esc=x=>text(x,200000).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const color=x=>/^#[0-9a-f]{6}$/i.test(x||'')?x:'#D4AF37';
 const dateOK=x=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(x||''))return false;const d=new Date(x+'T12:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===x;};
 const mins=x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x||'')?Number(x.slice(0,2))*60+Number(x.slice(3)):NaN;
 const clock=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
 const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
 const phone=x=>text(x).replace(/[\s()+-]/g,'');
 const active=a=>!a._deleted&&!['cancelled','no_show'].includes(a.status);
 const rows=(db,k)=>Object.values(db[k]||{}).filter(x=>!x._deleted);
 const empty=()=>Object.fromEntries(kinds.map(k=>[k,{}]));
 const defaultSettings=()=>({id:'main',name:'我的專屬空間',start:'11:00',end:'20:00',step:30,offColor:'#e5e5ea',sexOptions:['未填寫','男','女'],clientTags:[]});
 const fresh=()=>{const d=empty();d.settings.main=defaultSettings();d.stylists['sty-1']={id:'sty-1',name:'設計師A',color:'#1d1d1f',active:true};d.services['svc-1']={id:'svc-1',name:'剪髮',duration:60,color:'#D4AF37',active:true};d.methods.cash={id:'cash',name:'現金',color:'#8B4513',active:true};return d;};
 const cleanID=x=>{const s=text(x,160);if(!s||/[/.\u0000-\u001f]/.test(s)||s==='__proto__'||s==='constructor'||s==='prototype')throw Error('資料編號格式不正確');return s;};
 const birthday=(m,d)=>{if(!m&&!d)return '';const mm=Number(m),dd=Number(d);if(!Number.isInteger(mm)||!Number.isInteger(dd)||!dateOK(`2000-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`))throw Error('請填寫有效生日（月／日）');return `${String(mm).padStart(2,'0')}/${String(dd).padStart(2,'0')}`;};
 function migrate(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('備份內容不是有效資料');
  if(raw.format==='aether-booking'&&raw.version>319)throw Error('此備份來自較新版本，請先更新程式');
  if(raw.format==='aether-booking'||raw.settings?.main){const d=clone(raw.data||raw);validateDB(d);return {data:d,warnings:[]};}
  if(!Array.isArray(raw.appointments)||!Array.isArray(raw.clients)||!Array.isArray(raw.stylists))throw Error('缺少預約、顧客或人員資料，未匯入');
  const d=empty(),warnings=[];d.settings.main={...defaultSettings(),name:text(raw.storeName||'我的專屬空間',80),start:raw.startH||'11:00',end:raw.endH||'20:00',offColor:color(raw.offColor)};
  const put=(k,id,value)=>{id=cleanID(id);if(d[k][id])throw Error('備份有重複編號：'+k);d[k][id]={id,...value};return id;};
  raw.stylists.forEach(s=>put('stylists','sty-'+s.id,{name:text(s.name,80),color:color(s.color),active:true}));
  (raw.tags||[]).forEach(t=>put('services','svc-'+t.id,{name:text(t.name,100),duration:60,color:color(t.color),active:true}));
  (raw.payTagsDef||[]).forEach(t=>put('methods','pay-'+t.id,{name:text(t.name,80),color:color(t.color),active:true}));
  raw.clients.forEach((c,i)=>{let b='';try{b=birthday(c.bm,c.bd);}catch{warnings.push('有無效生日已留空，請核對');}put('clients','cli-legacy-'+i,{name:text(c.n||c.name,100),phone:text(c.p||c.phone,60),sex:c.sex==='M'?'男':c.sex==='F'?'女':'未填寫',styId:c.lastSty!=null?'sty-'+c.lastSty:'',birthday:b,note:text(c.note),tags:[],active:true});});
  raw.appointments.forEach((a,i)=>{
   const n=text(a.n||a.name,100),p=text(a.p||a.phone,60),sty='sty-'+a.styId;
   if(!d.stylists[sty])d.stylists[sty]={id:sty,name:'已移除人員（'+text(a.styId,30)+'）',color:'#8e8e93',active:false};
   const candidates=rows(d,'clients').filter(c=>c.name===n&&phone(c.phone)===phone(p));
   let clientId=candidates.length===1?candidates[0].id:'';
   if(a._guest===true)clientId='';
   if(!clientId&&a._guest!==true){clientId='cli-apt-'+i;d.clients[clientId]={id:clientId,name:n,phone:p,sex:a.sex==='M'?'男':a.sex==='F'?'女':'未填寫',styId:sty,birthday:'',note:'',tags:[],active:true};if(candidates.length>1)warnings.push(n+' 有同名同電話資料，預約已獨立保留，請核對顧客連結');}
   const serviceIds=(a.tags||[]).map((name,j)=>{let s=rows(d,'services').find(x=>x.name===name);if(!s){const id='svc-old-'+i+'-'+j;d.services[id]={id,name:text(name,100),duration:60,color:'#D4AF37',active:false};s=d.services[id];}return s.id;});
   const id=put('appointments','apt-'+(a.id??i),{clientId,guest:a._guest===true,legacyUnlinked:a._legacyUnlinked===true,name:n,phone:p,sex:a.sex==='M'?'男':a.sex==='F'?'女':'未填寫',styId:sty,date:a.date,time:a.time,duration:Number(a.duration)||60,people:Number(a.c||a.count)||1,serviceIds,status:a.done?'completed':'booked',note:text(a.note_full||a.note),vip:!!a.isVIP,overlapReason:'',durationEstimated:!a.duration});
   d.payments[id]={id,amount:Math.max(0,Number(a.price)||0),paid:0,methodIds:(a.payTags||[]).map(x=>'pay-'+x),note:'舊資料未區分已收金額，請核對'};
  });
  new Set([...(raw.offDays||[]),...Object.keys(raw.dayNotes||{})]).forEach(date=>{if(!dateOK(date)){d.settings.main.legacyDateIssues=d.settings.main.legacyDateIssues||[];d.settings.main.legacyDateIssues.push({value:date,off:(raw.offDays||[]).includes(date),note:text(raw.dayNotes?.[date]),color:color(raw.dayNoteColors?.[date]||raw.offColor)});warnings.push('有 '+String(date)+' 的排休／備忘日期需確認；已保留原值，不阻擋其他資料載入');return;}d.days[date]={id:date,date,off:(raw.offDays||[]).includes(date),note:text(raw.dayNotes?.[date]),color:color(raw.dayNoteColors?.[date]||raw.offColor)};});
  Object.entries(raw.slotOffDays||{}).forEach(([date,slots])=>slots.forEach((key,i)=>{const part=key.split('_'),t=part[1],styId='sty-'+part.slice(2).join('_');put('blocks',date+'-old-'+i,{date,styId,start:t,end:clock(Math.min(mins(t)+60,1439)),note:'舊版時段排休'});}));
  if(raw.appointments.length)warnings.push('付款標籤已保留；舊版沒有已收金額，未推定為已付款');
  validateDB(d);return {data:d,warnings:[...new Set(warnings)]};
 }

function qBars(title,icon,items,tone,unit='',hint=''){
 const max=Math.max(0,...items.map(x=>Number(x.value)||0));
 return `<section class="q-panel tone-${tone}"><h2><span class="q-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12m7 8V4m7 16V8"/></svg></span>${title}</h2>${hint?`<p class="hint">${hint}</p>`:''}<div class="q-chart-scroll"><div class="q-chart" style="--columns:${Math.max(items.length,1)}">${items.map(x=>`<div class="q-bar-item"><div class="q-value">${F(x.value)}${unit}</div><div class="q-track"><div class="q-fill" style="height:${max?Math.max(0,Number(x.value))/max*100:0}%"></div></div><div class="q-label">${E(x.label)}</div></div>`).join('')||'<p class="empty small">這段時間還沒有紀錄</p>'}</div></div></section>`;
}
function usefulStats(d,from,to,sty){
 const end=to>Core.today()?Core.today():to, s=Core.stats(d,from,end,sty),all=Core.rows(d,'appointments'),linked=a=>!a.guest&&!a.legacyUnlinked&&!!a.clientId&&!!d.clients[a.clientId];
 const ids=new Set(s.completed.filter(linked).map(a=>a.clientId));let fresh=0,returning=0;
 for(const id of ids){if(all.some(a=>linked(a)&&a.clientId===id&&a.status==='completed'&&a.date<from))returning++;else fresh++;}
 const unknown=s.completed.filter(a=>!linked(a)).reduce((n,a)=>n+a.people,0),hours={};
 s.all.filter(Core.active).forEach(a=>{const h=a.time.slice(0,2)+':00';hours[h]=(hours[h]||0)+a.people;});
 const overdue=Core.rows(d,'clients').filter(c=>c.active!==false&&(!sty||c.styId===sty)).map(c=>({c,r:Revisit.info(d,c,Core.today())})).filter(x=>x.r.elapsed>=30).sort((a,b)=>b.r.elapsed-a.r.elapsed);
 return {s,fresh,returning,unknown,average:s.people?s.revenue/s.people:null,hours,overdue};
}

const statsDrawerCache=new Map();
function statsDrawerPrefs(){const key='aether-stats-drawers:'+storageKey;if(!statsDrawerCache.has(key)){try{const v=JSON.parse(localStorage.getItem(key)||'{}');statsDrawerCache.set(key,{open:v.open&&typeof v.open==='object'?v.open:{},order:Array.isArray(v.order)?v.order:[]});}catch{statsDrawerCache.set(key,{open:{},order:[]});}}return {key,value:statsDrawerCache.get(key)};}
function arrangeStatsDrawers(){
 const root=$('#content .stats-space');if(!root)return;
 const {key,value:prefs}=statsDrawerPrefs();
 const save=()=>{try{localStorage.setItem(key,JSON.stringify(prefs));}catch{toast('此裝置無法保存排列，重新開啟後可能恢復預設',true);}};
 const ids=['revenue','customers','hours','revisit','weekday-revenue','weekday-people','services','methods','groups','payment-details'];
 const panels=[...root.children].filter(e=>e.matches('.revenue-hero,.q-panel'));
 const host=document.createElement('div');host.className='stats-drawers';root.append(host);
 const hint=document.createElement('p');hint.className='hint';hint.textContent='點標題展開／收起，會記住此裝置的選擇。用上下箭頭調整順序。';host.before(hint);
 const orderSave=()=>{prefs.order=[...host.children].map(e=>e.dataset.drawer);save();};
 panels.forEach((panel,i)=>{
 const id=ids[i],titleNode=panel.querySelector('summary,h2');const title=id==='revenue'?'完成服務金額':titleNode?.textContent.trim()||'數據';
 const row=document.createElement('section');row.className='stats-drawer';row.dataset.drawer=id;
 row.innerHTML=`<div class="drawer-head"><button type="button" class="drawer-toggle" aria-controls="drawer-body-${id}"><span class="drawer-chevron" aria-hidden="true">›</span><strong>${E(title)}</strong></button><div class="drawer-tools"><button type="button" class="drawer-up" aria-label="${E(title)}往上移">↑</button><button type="button" class="drawer-down" aria-label="${E(title)}往下移">↓</button><button hidden type="button" class="drawer-grip" aria-label="長按拖曳${E(title)}" title="長按拖曳">⠿</button></div></div><div class="drawer-body" id="drawer-body-${id}"></div>`;
 const body=row.querySelector('.drawer-body'),toggle=row.querySelector('.drawer-toggle');
 if(panel.tagName==='DETAILS'){titleNode?.remove();while(panel.firstChild)body.append(panel.firstChild);panel.remove();}else{titleNode?.remove();body.append(panel);}
 function show(open){body.hidden=!open;toggle.setAttribute('aria-expanded',String(open));row.classList.toggle('expanded',open);}
 show(prefs.open[id]===true);toggle.onclick=()=>{prefs.open[id]=body.hidden;show(prefs.open[id]);save();};
 row.querySelector('.drawer-up').onclick=()=>{const prev=row.previousElementSibling;if(prev){host.insertBefore(row,prev);orderSave();}};
 row.querySelector('.drawer-down').onclick=()=>{const next=row.nextElementSibling;if(next){host.insertBefore(next,row);orderSave();}};
 const grip=row.querySelector('.drawer-grip');let timer=null,dragging=false,startY=0;
 function stop(){clearTimeout(timer);timer=null;if(dragging)orderSave();dragging=false;row.classList.remove('dragging');}
 grip.onpointerdown=e=>{if(e.button!==0)return;startY=e.clientY;grip.setPointerCapture?.(e.pointerId);timer=setTimeout(()=>{dragging=true;row.classList.add('dragging');},350);};
 grip.onpointermove=e=>{if(!dragging){if(Math.abs(e.clientY-startY)>10){clearTimeout(timer);timer=null;}return;}e.preventDefault();const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.stats-drawer');if(target&&target!==row&&target.parentElement===host){const rect=target.getBoundingClientRect();host.insertBefore(row,e.clientY>rect.top+rect.height/2?target.nextSibling:target);}const scroll=$('#content'),r=scroll.getBoundingClientRect();if(e.clientY>r.bottom-70)scroll.scrollTop+=18;else if(e.clientY<r.top+70)scroll.scrollTop-=18;};
 grip.onpointerup=stop;grip.onpointercancel=stop;grip.onlostpointercapture=stop;grip.oncontextmenu=e=>e.preventDefault();grip.onclick=e=>e.preventDefault();
 host.append(row);
 });
 const rows=[...host.children];const rank=id=>{const i=prefs.order.indexOf(id);return i<0?100+ids.indexOf(id):i;};rows.sort((a,b)=>rank(a.dataset.drawer)-rank(b.dataset.drawer)).forEach(r=>host.append(r));
}

function fixLegacyDate(index){

function holidayDates(from,to,weekdays){
 if(!Core.dateOK(from)||!Core.dateOK(to)||from>to)throw Error('請選擇正確的起訖日期');
 const result=[],d=new Date(from+'T12:00:00Z'),end=new Date(to+'T12:00:00Z');
 if((end-d)/86400000>365)throw Error('一次最多設定一年，請分段安排');
 for(;d<=end;d.setUTCDate(d.getUTCDate()+1)){if(!weekdays.length||weekdays.includes(String(d.getUTCDay())))result.push(d.toISOString().slice(0,10));}
 if(!result.length)throw Error('這段期間沒有符合的星期');return result;
}
